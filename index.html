<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F5F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tabata">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Tabata</title>
<link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/bebas-neue.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="version" hidden></div>

<div id="home" class="view on">
  <div class="home-h">
    <h1>Timers</h1>
    <button class="icon" id="settings-open" aria-label="Réglages"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
  <button class="tile" id="tabata"><span>TABATA</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
</div>

<div id="settings" class="view">
  <div class="home-h"><h1>Réglages</h1></div>
  <div class="card neutral wide">
    <span class="l">Thème</span>
    <div class="seg" id="theme"><button data-value="light">Clair</button><button data-value="dark">Sombre</button><button data-value="auto">Auto</button></div>
  </div>
  <div class="card neutral wide">
    <span class="l">Son</span>
    <button class="switch" id="sound" role="switch" aria-label="Son"></button>
  </div>
  <div class="foot">
    <button class="icon" id="settings-back" aria-label="Retour à l'accueil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
  </div>
</div>

<div id="config" class="view">
  <div class="total"><span>Durée de la séance</span><b id="total"></b></div>

  <div class="card prep wide">
    <div class="cv"><span class="l">Préparation</span><span class="val"><input id="value-prep-min" data-key="prep" inputmode="numeric" maxlength="2" aria-label="Préparation, minutes"><i>:</i><input id="value-prep-sec" data-key="prep" inputmode="numeric" maxlength="2" aria-label="Préparation, secondes"></span></div>
    <div class="st"><button data-key="prep" data-step="-5" aria-label="Diminuer la préparation">−</button><button data-key="prep" data-step="5" aria-label="Augmenter la préparation">+</button></div>
  </div>

  <div class="block">
    <div class="pair">
      <div class="card work">
        <span class="l">Effort</span>
        <span class="val"><input id="value-work-min" data-key="work" inputmode="numeric" maxlength="2" aria-label="Effort, minutes"><i>:</i><input id="value-work-sec" data-key="work" inputmode="numeric" maxlength="2" aria-label="Effort, secondes"></span>
        <div class="st"><button data-key="work" data-step="-5" aria-label="Diminuer l'effort">−</button><button data-key="work" data-step="5" aria-label="Augmenter l'effort">+</button></div>
      </div>
      <div class="card rest">
        <span class="l">Repos</span>
        <span class="val"><input id="value-rest-min" data-key="rest" inputmode="numeric" maxlength="2" aria-label="Repos, minutes"><i>:</i><input id="value-rest-sec" data-key="rest" inputmode="numeric" maxlength="2" aria-label="Repos, secondes"></span>
        <div class="st"><button data-key="rest" data-step="-5" aria-label="Diminuer le repos">−</button><button data-key="rest" data-step="5" aria-label="Augmenter le repos">+</button></div>
      </div>
    </div>
    <div class="sets">
      <span class="l">Séries</span><input id="value-sets" class="num" data-key="sets" inputmode="numeric" maxlength="2" aria-label="Nombre de séries">
      <div class="st"><button data-key="sets" data-step="-1" aria-label="Moins de séries">−</button><button data-key="sets" data-step="1" aria-label="Plus de séries">+</button></div>
    </div>
  </div>

  <div class="pair">
    <div class="card neutral">
      <span class="l">Cycles</span>
      <input id="value-cycles" class="val" data-key="cycles" inputmode="numeric" maxlength="2" aria-label="Nombre de cycles">
      <div class="st"><button data-key="cycles" data-step="-1" aria-label="Moins de cycles">−</button><button data-key="cycles" data-step="1" aria-label="Plus de cycles">+</button></div>
    </div>
    <div class="card cycleRest">
      <span class="l">Repos entre cycles</span>
      <span class="val"><input id="value-cycleRest-min" data-key="cycleRest" inputmode="numeric" maxlength="2" aria-label="Repos entre cycles, minutes"><i>:</i><input id="value-cycleRest-sec" data-key="cycleRest" inputmode="numeric" maxlength="2" aria-label="Repos entre cycles, secondes"></span>
      <div class="st"><button data-key="cycleRest" data-step="-5" aria-label="Diminuer le repos entre cycles">−</button><button data-key="cycleRest" data-step="5" aria-label="Augmenter le repos entre cycles">+</button></div>
    </div>
  </div>

  <div class="foot">
    <button class="icon" id="config-back" aria-label="Retour à l'accueil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="go" id="go">Démarrer</button>
  </div>
</div>

<div id="timer" class="view">
  <div class="prog">
    <div class="counter"><span>Séries</span><div class="dots" id="dots-sets"></div></div>
    <div class="counter" id="counter-cycles"><span>Cycles</span><div class="dots" id="dots-cycles"></div></div>
  </div>
  <div class="phase">
    <span id="label"></span>
    <div class="bar"><div id="bar"></div></div>
    <span id="time"></span>
    <span class="left"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v5l3 2"/></svg><span id="left"></span></span>
  </div>
  <div class="next-row">
    <div class="next" id="next"><i id="next-dot"></i><span>Ensuite</span><b id="next-txt"></b></div>
    <button class="unmute" id="unmute" aria-label="Réactiver le son" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></button>
  </div>
  <div class="ctrl">
    <button class="stop" id="stop">Arrêter</button>
    <button class="pause" id="pause" aria-label="Pause">
      <svg id="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>
      <svg id="ico-play" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M7 4.5v15l12.5-7.5z"/></svg>
    </button>
    <button class="skip" id="skip" aria-label="Passer à l'étape suivante"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l10 7-10 7z"/><path d="M19 5v14"/></svg></button>
  </div>
</div>

<div id="done" class="view">
  <span class="done-l">Terminé</span>
  <span class="done-t">✓</span>
  <span id="done-sum"></span>
  <button class="go" id="again">Recommencer</button>
  <button class="stop" id="home-open">Accueil</button>
</div>

<script src="app.js"></script>
</body>
</html>
