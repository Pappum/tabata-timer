<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F5F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tabata">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Tabata</title>
<link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/bebas-neue.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="ver" hidden></div>

<div id="setup" class="view on">
  <div class="total"><span>Durée de la séance</span><b id="total"></b></div>

  <div class="card prep wide">
    <div class="cv"><span class="l">Préparation</span><span class="val"><input id="v-prep-m" data-k="prep" inputmode="numeric" maxlength="2" aria-label="Préparation, minutes"><i>:</i><input id="v-prep-s" data-k="prep" inputmode="numeric" maxlength="2" aria-label="Préparation, secondes"></span></div>
    <div class="st"><button data-k="prep" data-d="-5" aria-label="Diminuer la préparation">−</button><button data-k="prep" data-d="5" aria-label="Augmenter la préparation">+</button></div>
  </div>

  <div class="block">
    <div class="pair">
      <div class="card work">
        <span class="l">Effort</span>
        <span class="val"><input id="v-work-m" data-k="work" inputmode="numeric" maxlength="2" aria-label="Effort, minutes"><i>:</i><input id="v-work-s" data-k="work" inputmode="numeric" maxlength="2" aria-label="Effort, secondes"></span>
        <div class="st"><button data-k="work" data-d="-5" aria-label="Diminuer l'effort">−</button><button data-k="work" data-d="5" aria-label="Augmenter l'effort">+</button></div>
      </div>
      <div class="card rest">
        <span class="l">Repos</span>
        <span class="val"><input id="v-rest-m" data-k="rest" inputmode="numeric" maxlength="2" aria-label="Repos, minutes"><i>:</i><input id="v-rest-s" data-k="rest" inputmode="numeric" maxlength="2" aria-label="Repos, secondes"></span>
        <div class="st"><button data-k="rest" data-d="-5" aria-label="Diminuer le repos">−</button><button data-k="rest" data-d="5" aria-label="Augmenter le repos">+</button></div>
      </div>
    </div>
    <div class="sets">
      <span class="l">Séries</span><input id="v-sets" class="num" data-k="sets" inputmode="numeric" maxlength="2" aria-label="Nombre de séries">
      <div class="st"><button data-k="sets" data-d="-1" aria-label="Moins de séries">−</button><button data-k="sets" data-d="1" aria-label="Plus de séries">+</button></div>
    </div>
  </div>

  <div class="pair">
    <div class="card neutral">
      <span class="l">Cycles</span>
      <input id="v-cycles" class="val" data-k="cycles" inputmode="numeric" maxlength="2" aria-label="Nombre de cycles">
      <div class="st"><button data-k="cycles" data-d="-1" aria-label="Moins de cycles">−</button><button data-k="cycles" data-d="1" aria-label="Plus de cycles">+</button></div>
    </div>
    <div class="card cyc">
      <span class="l">Repos entre cycles</span>
      <span class="val"><input id="v-cycleRest-m" data-k="cycleRest" inputmode="numeric" maxlength="2" aria-label="Repos entre cycles, minutes"><i>:</i><input id="v-cycleRest-s" data-k="cycleRest" inputmode="numeric" maxlength="2" aria-label="Repos entre cycles, secondes"></span>
      <div class="st"><button data-k="cycleRest" data-d="-5" aria-label="Diminuer le repos entre cycles">−</button><button data-k="cycleRest" data-d="5" aria-label="Augmenter le repos entre cycles">+</button></div>
    </div>
  </div>

  <button class="go" id="go">Démarrer</button>
</div>

<div id="timer" class="view">
  <div class="prog">
    <div class="pc"><span>Séries</span><div class="dots" id="d-sets"></div></div>
    <div class="pc" id="pc-cycles"><span>Cycles</span><div class="dots" id="d-cycles"></div></div>
  </div>
  <div class="phase">
    <span id="label"></span>
    <div class="bar"><div id="bar"></div></div>
    <span id="time"></span>
    <span class="left"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v5l3 2"/></svg><span id="left"></span></span>
  </div>
  <div class="next" id="next"><i id="next-dot"></i><span>Ensuite</span><b id="next-txt"></b></div>
  <div class="ctrl">
    <button class="stop" id="stop">Arrêter</button>
    <button class="pause" id="pause" aria-label="Pause">
      <svg id="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>
      <svg id="ico-play" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M7 4.5v15l12.5-7.5z"/></svg>
    </button>
    <button class="skip" id="skip" aria-label="Passer à l'étape suivante"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l10 7-10 7z"/><path d="M19 5v14"/></svg></button>
  </div>
</div>

<div id="done" class="view">
  <span class="done-l">Terminé</span>
  <span class="done-t">✓</span>
  <span id="done-sum"></span>
  <button class="go" id="again">Recommencer</button>
  <button class="stop" id="back">Réglages</button>
</div>

<script src="app.js"></script>
</body>
</html>
