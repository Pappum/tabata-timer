<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tabata">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Tabata</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0}
body{font-family:-apple-system,system-ui,sans-serif;background:#111;color:#fff;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  transition:background .2s}
body.prep{background:#b36b00}
body.work{background:#0a7d3b}
body.rest{background:#1a4fa0}
body.done{background:#5b2a9e}
.view{display:none;height:100%;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:20px}
.view.on{display:flex}
h1{margin:0 0 8px;font-size:28px}
.row{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:340px;
  background:#222;border-radius:14px;padding:10px 12px}
.row span.l{font-size:17px}
.row .c{display:flex;align-items:center;gap:14px}
.row b{min-width:48px;text-align:center;font-size:24px;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;border-radius:12px;background:#333;cursor:pointer}
.row button{width:44px;height:44px;font-size:24px}
.big{width:100%;max-width:340px;padding:18px;font-size:22px;font-weight:600;background:#0a7d3b}
.sec{width:100%;max-width:340px;padding:16px;font-size:18px;background:rgba(0,0,0,.3)}
#label{font-size:30px;letter-spacing:.1em;text-transform:uppercase}
#time{font-size:min(42vw,200px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#round{font-size:22px;opacity:.85}
</style>
</head>
<body>

<div id="setup" class="view on">
  <h1>Tabata</h1>
  <div class="row"><span class="l">Préparation</span><span class="c"><button data-k="prep" data-d="-5">−</button><b id="v-prep"></b><button data-k="prep" data-d="5">+</button></span></div>
  <div class="row"><span class="l">Effort</span><span class="c"><button data-k="work" data-d="-5">−</button><b id="v-work"></b><button data-k="work" data-d="5">+</button></span></div>
  <div class="row"><span class="l">Repos</span><span class="c"><button data-k="rest" data-d="-5">−</button><b id="v-rest"></b><button data-k="rest" data-d="5">+</button></span></div>
  <div class="row"><span class="l">Rounds</span><span class="c"><button data-k="rounds" data-d="-1">−</button><b id="v-rounds"></b><button data-k="rounds" data-d="1">+</button></span></div>
  <button class="big" id="go">Démarrer</button>
</div>

<div id="timer" class="view">
  <div id="label"></div>
  <div id="time"></div>
  <div id="round"></div>
  <button class="sec" id="pause">Pause</button>
  <button class="sec" id="stop">Arrêter</button>
</div>

<script>
const $ = id => document.getElementById(id);
const MIN = {prep:0, work:5, rest:0, rounds:1};
const LABELS = {prep:'Préparation', work:'Effort', rest:'Repos'};
let cfg = {prep:10, work:20, rest:10, rounds:8};
try { Object.assign(cfg, JSON.parse(localStorage.getItem('tabata') || '{}')); } catch {}

function renderCfg() { for (const k in cfg) $('v-' + k).textContent = cfg[k]; }
renderCfg();

document.querySelectorAll('.row button').forEach(b => b.onclick = () => {
  const k = b.dataset.k;
  cfg[k] = Math.max(MIN[k], cfg[k] + +b.dataset.d);
  try { localStorage.setItem('tabata', JSON.stringify(cfg)); } catch {}
  renderCfg();
});

let actx, phases, idx, end, left, paused, tick, lastSec, wake;

function beep(freq, dur) {
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
  o.frequency.value = freq;
  o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(.3, t);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.start(t); o.stop(t + dur);
}

async function lock() {
  try { wake = await navigator.wakeLock.request('screen'); } catch {}
}
function unlock() {
  try { wake && wake.release(); } catch {}
  wake = null;
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && tick) lock();
});

function view(id) {
  $('setup').classList.toggle('on', id === 'setup');
  $('timer').classList.toggle('on', id === 'timer');
}

function start() {
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  actx.resume();
  phases = [];
  if (cfg.prep > 0) phases.push({t:'prep', d:cfg.prep, r:0});
  for (let r = 1; r <= cfg.rounds; r++) {
    phases.push({t:'work', d:cfg.work, r});
    if (r < cfg.rounds && cfg.rest > 0) phases.push({t:'rest', d:cfg.rest, r});
  }
  idx = -1; paused = false;
  $('pause').textContent = 'Pause';
  view('timer');
  lock();
  next();
  tick = setInterval(loop, 100);
}

function next() {
  idx++;
  if (idx >= phases.length) return finish();
  const p = phases[idx];
  end = Date.now() + p.d * 1000;
  lastSec = p.d;
  document.body.className = p.t;
  $('label').textContent = LABELS[p.t];
  $('time').textContent = p.d;
  $('round').textContent = p.r ? 'Round ' + p.r + ' / ' + cfg.rounds : ' ';
  beep(p.t === 'work' ? 880 : p.t === 'rest' ? 440 : 660, .4);
}

function loop() {
  if (paused) return;
  const ms = end - Date.now();
  if (ms <= 0) return next();
  const s = Math.ceil(ms / 1000);
  if (s !== lastSec) {
    lastSec = s;
    $('time').textContent = s;
    if (s <= 3) beep(520, .12);
  }
}

function finish() {
  clearInterval(tick); tick = null;
  unlock();
  document.body.className = 'done';
  $('label').textContent = 'Terminé';
  $('time').textContent = '✓';
  $('round').textContent = cfg.rounds + ' rounds';
  $('pause').textContent = 'Recommencer';
  paused = 'done';
  [0, 200, 400].forEach(d => setTimeout(() => beep(880, .15), d));
}

function stop() {
  clearInterval(tick); tick = null;
  unlock();
  document.body.className = '';
  view('setup');
}

$('go').onclick = start;
$('stop').onclick = stop;
$('pause').onclick = () => {
  if (paused === 'done') return start();
  if (paused) { end = Date.now() + left; paused = false; $('pause').textContent = 'Pause'; }
  else { left = end - Date.now(); paused = true; $('pause').textContent = 'Reprendre'; }
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
